name: Learnpack audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: npm install @learnpack/learnpack@latest -g
    - run: learnpack audit

  exercises:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: pip install pytest==6.2.5 pytest-testdox mock
    - name: Solutions pass and starters fail
      run: python scripts/validate_exercises.py
